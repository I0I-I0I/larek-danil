services:
  backend:
    build:
      context: ./backend
    restart: always
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/larek.db

  frontend:
    build:
      context: ./frontend
    restart: always

  caddy:
    image: caddy:latest
    container_name: larek-danil-caddy
    restart: always
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=localhost
    depends_on:
      - backend
      - frontend
    networks:
      - default
      - proxy-net

networks:
  proxy-net:
    external: true

volumes:
  caddy_data:
  caddy_config:
  backend_data:
  backend_uploads:
